[package]
name = "haiyaku"
description = "Spoiler-safe character events from books, stored in the caller's SQLite database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["bundled"]
# rusqlite compiles the SQLite it links. A feature of this crate rather than
# always on, so a caller that already links SQLite its own way (taiyaku, with
# its own `bundled`) depends with `default-features = false` and the two
# cannot disagree about which SQLite the one connection uses.
bundled = ["rusqlite/bundled"]

[dependencies]
rusqlite = { version = "0.43", features = ["backup"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
