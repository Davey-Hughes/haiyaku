[package]
name = "haiyaku"
description = "Spoiler-safe character events from books, stored in the caller's SQLite database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["bundled", "cli"]
# rusqlite compiles the SQLite it links. A feature of this crate rather than
# always on, so a caller that already links SQLite its own way (taiyaku, with
# its own `bundled`) depends with `default-features = false` and the two
# cannot disagree about which SQLite the one connection uses.
bundled = ["rusqlite/bundled"]
# The EPUB reader, the model backends and extraction, with every dependency
# they need. Off in taiyaku's build, whose server only reads logs and folds
# them: with `default-features = false` it compiles none of this.
extract = ["dep:html-escape", "dep:serde_json", "dep:ureq", "dep:zip"]
# The `haiyaku` binary, and the reader of its series file.
cli = ["extract", "dep:clap", "dep:toml"]

[[bin]]
name = "haiyaku"
path = "src/bin/haiyaku/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
html-escape = { version = "0.2", optional = true }
rusqlite = { version = "0.43", features = ["backup"] }
serde_json = { version = "1.0.151", optional = true }
sha2 = "0.11"
# `serde` is what gives `toml::Table`; the file is read from the table by hand, so no derive is needed.
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"], optional = true }
ureq = { version = "3.5", default-features = false, features = ["json"], optional = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3"
