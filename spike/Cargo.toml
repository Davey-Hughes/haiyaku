[package]
name = "haiyaku-spike"
version = "0.0.0"
edition = "2024"
publish = false

# An empty workspace of its own, so a workspace at the repository root can
# never pull the spike in.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
